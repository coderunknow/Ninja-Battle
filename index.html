<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Naruto vs Sasuke — Cinematic Stickman Battle</title>
<meta name="description" content="A four-minute cinematic stickman battle rendered entirely with Canvas2D and synthesised audio. No external assets." />
<meta name="theme-color" content="#07080d" />
<link rel="stylesheet" href="./src/ui/style.css" />
</head>
<body>
  <div id="app">
    <div id="stage-wrap">
      <canvas id="stage" aria-label="Animated battle between Naruto and Sasuke"></canvas>

      <!-- Start gate: satisfies browser autoplay policy for audio -->
      <div id="gate">
        <div class="gate-inner">
          <div class="gate-kicker">A STICKMAN CINEMATIC</div>
          <h1>NARUTO <span class="vs">vs</span> SASUKE</h1>
          <div class="gate-sub">The Valley of the Fallen</div>
          <button id="begin" class="primary" autofocus>
            <span class="play-icon"></span>
            BEGIN
          </button>
          <div class="gate-note">
            Sound on &middot; 4:18 &middot; headphones recommended
          </div>
          <div class="gate-hint">
            <kbd>Space</kbd> play/pause &nbsp; <kbd>&larr;</kbd><kbd>&rarr;</kbd> seek 5s
            &nbsp; <kbd>F</kbd> fullscreen &nbsp; <kbd>M</kbd> mute
          </div>
        </div>
      </div>

      <!-- Player chrome -->
      <div id="chrome" class="hidden">
        <div id="topbar">
          <div class="brand">NARUTO <span>vs</span> SASUKE</div>
          <div class="top-right">
            <button id="quality" class="chip" title="Rendering quality">HIGH</button>
            <span id="fps" class="chip mono" title="Measured frames per second">-- fps</span>
            <button id="fullscreen" class="icon-btn" title="Fullscreen (F)" aria-label="Fullscreen">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
          </div>
        </div>

        <div id="bottombar">
          <div class="controls-row">
            <button id="playpause" class="icon-btn big" title="Play / Pause (Space)" aria-label="Play">
              <svg id="icon-play" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>
              <svg id="icon-pause" viewBox="0 0 24 24" width="22" height="22" class="hidden" aria-hidden="true"><path d="M7 4.5h4v15H7zM13 4.5h4v15h-4z" fill="currentColor"/></svg>
            </button>
            <button id="replay" class="icon-btn" title="Replay from start (R)" aria-label="Replay">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 12a8 8 0 1 1 2.7 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 4.5V11h6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <span id="time" class="mono time">0:00 <span class="dim">/ 4:18</span></span>

            <div id="scrub" class="scrub" role="slider" tabindex="0" aria-label="Timeline position" aria-valuemin="0" aria-valuemax="258" aria-valuenow="0">
              <div class="scrub-track">
                <div id="scrub-buffer" class="scrub-buffer"></div>
                <div id="scrub-fill" class="scrub-fill"></div>
                <div id="scrub-marks" class="scrub-marks"></div>
                <div id="scrub-knob" class="scrub-knob"></div>
              </div>
              <div id="scrub-tip" class="scrub-tip mono">0:00</div>
            </div>

            <div class="volume">
              <button id="mute" class="icon-btn" title="Mute (M)" aria-label="Mute">
                <svg id="icon-vol" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z" fill="currentColor"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.7a7.6 7.6 0 0 1 0 10.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                <svg id="icon-mute" viewBox="0 0 24 24" width="18" height="18" class="hidden" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              </button>
              <input id="vol" type="range" min="0" max="100" value="85" aria-label="Volume" />
            </div>
          </div>
        </div>
      </div>

      <div id="toast" class="hidden"></div>
    </div>
  </div>
  <noscript>This experience requires JavaScript and a modern browser (Chrome or Edge recommended).</noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
